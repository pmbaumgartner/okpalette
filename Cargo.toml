[package]
name = "okpalette"
version = "1.1.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Fast, deterministic OKLab categorical color palettes powered by Rust"
readme = "README.md"
repository = "https://github.com/pmbaumgartner/okpalette"
homepage = "https://github.com/pmbaumgartner/okpalette"
documentation = "https://docs.rs/okpalette"
keywords = ["color", "palette", "glasbey", "categorical", "oklab"]
categories = ["algorithms", "graphics", "visualization"]
publish = ["crates-io"]
exclude = [
    ".github/**",
    ".gitignore",
    "AGENTS.md",
    "docs/**",
    "examples/**",
    "pyproject.toml",
    "python/**",
    "tests/*.py",
    "uv.lock",
]

[lib]
name = "okpalette"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
# Use abi3-py312 so one wheel can support Python 3.12+ where PyO3 APIs allow it.
pyo3 = { version = "0.28.3", features = ["abi3-py312"], optional = true }
png = "0.18"
rayon = "1.12"
rstar = "0.13"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "generate"
harness = false
