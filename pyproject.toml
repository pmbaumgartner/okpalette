[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "okpalette"
version = "1.1.1"
description = "Fast, deterministic OKLab categorical color palettes powered by Rust"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["color", "palette", "glasbey", "categorical", "oklab", "visualization"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
okpalette = "okpalette._cli:main"

[project.urls]
Homepage = "https://github.com/pmbaumgartner/okpalette"
Repository = "https://github.com/pmbaumgartner/okpalette"
Issues = "https://github.com/pmbaumgartner/okpalette/issues"
Changelog = "https://github.com/pmbaumgartner/okpalette/blob/main/CHANGELOG.md"
Documentation = "https://github.com/pmbaumgartner/okpalette#readme"

[project.optional-dependencies]
dev = [
  "hypothesis>=6",
  "matplotlib>=3.9",
  "maturin>=1.9,<2",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.11",
  "scikit-learn>=1.5",
  "ty>=0.0.37",
]

[tool.maturin]
python-source = "python"
module-name = "okpalette._core"
bindings = "pyo3"
features = ["python"]
include = [
  { path = "pyproject.toml", format = "sdist" },
  { path = "python/**/*.py", format = "sdist" },
  { path = "python/**/*.pyi", format = "sdist" },
  { path = "python/**/py.typed", format = "sdist" },
  { path = "python/**/*.md", format = "sdist" },
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "plot_smoke: opt-in palette preview smoke tests that write review images",
]
